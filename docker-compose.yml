services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock_local_dev
      POSTGRES_DB: seatlock
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # Deliberately ephemeral: no volume, persistence disabled (--save "" and
    # --appendonly no). Redis here is a cache — Postgres is the source of
    # truth for hold expiry (see CLAUDE.md invariant I3 / SPEC.md section 5).
    # Phase 8's chaos suite kills this container to prove invariants survive
    # total Redis data loss; if Redis persisted to disk, that test would be
    # meaningless.
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
